name: Python Code Quality & Syntax

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-syntax:
    name: Python Linting & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Syntax & Style with Ruff
        run: |
          ruff check . --select E9,F63,F7,F82
